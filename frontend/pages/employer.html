<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard - AI Resume Analyzer</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="dashboard-header">
    <div class="brand">
        <span class="brand-mark">✦</span>
        <span>AI Resume Analyzer</span>
    </div>

    <div class="header-actions">
        <span class="status-pill">
            <span class="status-dot"></span>
            Employer Mode
        </span>

        <button id="logoutButton" class="btn btn-secondary">
            Logout
        </button>
    </div>
</header>

<main class="dashboard-container">
    <section class="welcome-section">
        <div class="hero-content">
            <div>
                <span class="eyebrow">Employer dashboard</span>
                <h1>Build a stronger pipeline.</h1>
                <p>Create and manage high-fit roles while keeping your hiring process organized and efficient.</p>
            </div>

            <div class="hero-visual" aria-hidden="true">
                <div class="hero-orbit"></div>
                <div class="hero-core">✦</div>
            </div>
        </div>
    </section>

    <section class="dashboard-card">
        <div class="section-header">
            <div>
                <span class="section-label">Create role</span>
                <h2>Create Job</h2>
            </div>
        </div>

        <form id="jobForm">
            <div class="form-group">
                <label for="jobTitle">Job Title</label>
                <input type="text" id="jobTitle" placeholder="Job Title" required>
            </div>

            <div class="form-group">
                <label for="jobContent">Job Description</label>
                <textarea id="jobContent" placeholder="Job Description" rows="6" required></textarea>
            </div>

            <div class="form-group">
                <label for="jobSkills">Required Skills</label>
                <input type="text" id="jobSkills" placeholder="Required Skills (Python, SQL, Machine Learning)">
            </div>

            <button type="submit" class="btn btn-primary">Create Job</button>
        </form>

        <p id="jobMessage" class="message"></p>
    </section>

    <section class="dashboard-card">
        <div class="section-header">
            <div>
                <span class="section-label">Open roles</span>
                <h2>My Jobs</h2>
            </div>
            <button id="refreshJobs" class="btn btn-secondary">Refresh</button>
        </div>

        <input type="text" id="jobSearch" placeholder="Search jobs...">
        <div id="jobList">
            <p>Loading jobs...</p>
        </div>
    </section>
</main>

<script src="../js/api.js"></script>
<script src="../js/employer.js"></script>

</body>
</html>
